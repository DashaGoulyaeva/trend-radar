[project]
name = "trend-radar"
version = "0.1.0"
description = "Trend Radar data pipeline and API"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.27",
  "pydantic>=2.6",
  "python-dotenv>=1.0",
  "feedparser>=6.0"
]

[project.scripts]
trend-radar-pipeline = "trend_radar.pipeline:main"
trend-radar-api = "trend_radar.api:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
