<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Радар трендов — Настройки</title>
    <link rel="stylesheet" href="assets/styles.css" />

  <body data-page="settings">

        <p class="subtle">Укажи адрес локального API.</p>

        <div class="panel">

          <div style="margin-top: 12px; display: flex; gap: 12px; flex-wrap: wrap;">
            <button class="button" id="saveApi">Сохранить</button>

          <div id="apiStatus" class="status" style="margin-top: 12px;"></div>
